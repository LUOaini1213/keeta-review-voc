name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit + integration tests
        run: python -m pytest -q

      # No network and no LLM here: everything below runs from the committed, text-free snapshot
      # (reviews_meta.csv + frozen labels). The LLM labels were produced once, locally, and are frozen.
      - name: Label quality recomputed from committed labels
        run: python scripts/evaluate_labels.py --check

      - name: Every SQL query equals its pandas re-implementation; metrics.json is current
        run: python scripts/compute_metrics.py --check

      - name: Every number in README.md / REPORT.md matches the results files
        run: python scripts/check_numbers.py --check

      - name: Dashboard is current
        run: python scripts/build_dashboard.py --check

      - name: Mutation check with JUnit evidence
        run: python scripts/mutation_check.py --no-report

      - name: Preserve mutation logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-evidence-${{ matrix.os }}
          path: mutation-artifacts/
          if-no-files-found: ignore
